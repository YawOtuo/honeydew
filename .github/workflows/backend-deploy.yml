name: Deploy Backend

on:
  push:
    branches: [main]
    paths: ['backend/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Sync Heroku config vars
        uses: heroku/cli-action@v2
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          APP_TIMEZONE: ${{ vars.APP_TIMEZONE }}
        with:
          args: config:set "DATABASE_URL=$DATABASE_URL" "JWT_SECRET=$JWT_SECRET" "SEED_ADMIN_EMAIL=$SEED_ADMIN_EMAIL" "SEED_ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD" "APP_TIMEZONE=$APP_TIMEZONE" --app "$HEROKU_APP_NAME"
      - uses: akhileshns/heroku-deploy@v3.14.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ vars.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          appdir: backend
